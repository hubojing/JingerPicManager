name: jingerpicmanager
description: A local-first Windows desktop photo album manager.

publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  path: ^1.9.0
  sqflite_common_ffi: ^2.3.0
  image: ^4.1.3
  provider: ^6.1.1
  file_selector: ^1.0.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
